name: Verify VideoScope v4
on:
  push:
    branches: [codex/videoscope-provider-engine-v4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run db:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-verification
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
