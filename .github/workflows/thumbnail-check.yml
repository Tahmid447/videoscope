name: Verify original thumbnail rendering
on:
  push:
    branches: [fix/verified-video-metadata]
    paths: [scripts/thumbnail-check.mjs, .github/workflows/thumbnail-check.yml]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/thumbnail-check.mjs
