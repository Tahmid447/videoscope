name: Diagnose archive-style sources
on:
  push:
    branches: [fix/archive-site-support-v34]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect public archive and post markup
        run: node scripts/archive-diagnostic.mjs
