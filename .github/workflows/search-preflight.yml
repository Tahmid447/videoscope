name: Search repair preflight
on:
  push:
    branches: [fix/search-complete-v37]
    paths: [.github/workflows/search-preflight.yml, scripts/apply-search-v37.mjs]
permissions:
  contents: write
concurrency:
  group: videoscope-search-preflight
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref_name == 'fix/search-complete-v37'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply targeted source migration
        run: |
          if grep -q "VERSION='3.6.0'" lib/extract.mjs; then
            node scripts/apply-search-v37.mjs
          fi
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p=JSON.parse(readFileSync('package.json','utf8'));
          // The obsolete 3.2 src/core suite is not part of the deployed app.
          p.scripts.test='node --test tests/metadata.test.mjs tests/search.test.mjs';
          writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Build and regression tests
        run: |
          npm run build
          npm test
          npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/api.mjs
      - name: Desktop and mobile controls
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Compare all advertised search pages to their original records
        run: node scripts/search-complete-live.mjs
      - name: Commit verified edits to this repair branch only
        run: |
          git add lib/extract.mjs lib/scanner.mjs netlify/functions/api.mts static/index.html static/app.js package.json scripts/ui-check.mjs scripts/hosted-check.mjs tests/metadata.test.mjs .github/workflows/download-check.yml
          if ! git diff --cached --quiet; then
            git -c user.name='VideoScope verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix search cards, complete pagination, and resumable saved progress'
            git push origin HEAD:fix/search-complete-v37
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-preflight-evidence
          path: |
            artifacts-search/
            artifacts/
          retention-days: 7
