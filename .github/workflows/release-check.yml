name: Verify production release
on:
  push:
    branches: [main]
    paths: ['static/**', 'lib/**', 'netlify/**', '.github/workflows/release-check.yml']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed production site, not just the build
        run: node scripts/hosted-check.mjs
        env:
          SITE_URL: https://videoscope-3-tahmid.netlify.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: artifacts/
          retention-days: 7
