name: Manual Cloudflare release
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        required: true
        options: [preview, production]
        default: preview
      acceptance_run:
        description: 'For production: successful controlled preview-acceptance run ID for this exact commit'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm run db:local
      - name: Require exact-commit preview acceptance for production
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
        run: node scripts/release-gate.mjs
      - name: Migrate and deploy once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          if [ "$RELEASE_TARGET" = "production" ]; then
            npx wrangler d1 migrations apply DB --remote --env ""
            npx wrangler deploy --env "" --var BUILD_SHA:$GITHUB_SHA
          else
            npx wrangler d1 migrations apply DB --remote --env preview
            npx wrangler deploy --env preview --var BUILD_SHA:$GITHUB_SHA
          fi
