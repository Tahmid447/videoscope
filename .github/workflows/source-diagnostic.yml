name: Source diagnostic
on:
  push:
    branches: [fix/verified-video-metadata]
    paths: [.github/workflows/source-diagnostic.yml, scripts/detail-diagnostic.mjs]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/detail-diagnostic.mjs
