name: Audit public search coverage
on:
  push:
    branches: [fix/search-complete-v37]
    paths: [.github/workflows/search-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/search-source-audit.mjs
