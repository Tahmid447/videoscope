name: VideoScope media and provider preflight
on:
  push:
    branches: [fix/providers-and-downloads-v4]
    paths-ignore: ['.github/workflows/provider-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: videoscope-v4-preflight
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: 'v2.x'}
      - name: Install dependencies
        run: |
          mkdir -p artifacts-v4
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg > artifacts-v4/system-install.log 2>&1 || { tail -n 30 artifacts-v4/system-install.log; exit 1; }
          npm install --ignore-scripts --no-audit --no-fund > artifacts-v4/npm-install.log 2>&1 || { tail -n 30 artifacts-v4/npm-install.log; exit 1; }
          npm install --no-save --ignore-scripts typescript @types/node >> artifacts-v4/npm-install.log 2>&1
          python -m pip install -q -r requirements-media.txt pytest httpx ruff
          ffmpeg -version | head -n 1
      - name: Build, syntax, lint, and type checks
        run: |
          npm run build
          npm test
          python -m compileall -q media_api tests_media
          ruff check --select E9,F63,F7,F82 media_api tests_media
          npx tsc --noEmit --allowImportingTsExtensions --allowJs --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 netlify/functions/api.mts
          npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/api.mjs
          node --check static/app.js
          node --check static/media.js
      - name: Download actual MP4, HLS, and DASH files through backend
        run: python -m pytest tests_media/test_pipeline.py -v --junitxml=artifacts-v4/media-tests.xml
      - name: Real browser attachment and playback tests
        run: |
          npx playwright install --with-deps chromium webkit firefox > artifacts-v4/browser-install.log 2>&1 || { tail -n 40 artifacts-v4/browser-install.log; exit 1; }
          node scripts/media-browser-check.mjs
      - name: Guarded YouTube provider test on the reported channel
        run: PYTHONPATH=. python scripts/provider-preflight.py
      - name: Validate production container
        run: docker build -f Dockerfile.media -t videoscope-media-preflight . > artifacts-v4/docker-build.log 2>&1 || { tail -n 50 artifacts-v4/docker-build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videoscope-v4-preflight-evidence
          path: artifacts-v4/
          retention-days: 7
